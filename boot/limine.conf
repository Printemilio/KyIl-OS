timeout: 0

/Vex-OS
protocol: limine
resolution: 1920x1080x32
path: boot():/boot/vex-os

# Optional boot modules are imported by Vex-OS at startup into:
    # /home/root/bin/<module filename>
    #
    # Example: copy an ELF binary to build/iso_root/hello during ISO creation,
    # then enable one module_path line below:
    module_path: boot():/hello
    module_path: boot():/alloc_stress
    module_path: boot():/net_test
    module_path: boot():/gpu_test
    module_path: boot():/vk_test
    module_path: boot():/mouse_test
    module_path: boot():/webkit
    module_path: boot():/webkit_linux_main
    # WPEWebProcess / WPENetworkProcess must live at the PKGLIBEXECDIR path baked
    # into libWPEWebKit at build time: /usr/local/libexec/wpe-webkit-2.0/
    module_path: boot():/usr/local/libexec/wpe-webkit-2.0/WPEWebProcess
    module_path: boot():/usr/local/libexec/wpe-webkit-2.0/WPENetworkProcess
    module_path: boot():/WPEWebDriver
    module_path: boot():/jsc
    # ld-linux is needed immediately at ELF load time — keep it as a Limine module
    # so it is available without a CD-ROM read on the critical path.
    module_path: boot():/ld-linux-x86-64.so.2
    module_path: boot():/lib64/ld-linux-x86-64.so.2
    # ── WebKit build libs ─────────────────────────────────────────────────────
    module_path: boot():/lib/libWPEWebKit-2.0.so.1
    module_path: boot():/lib/libWPEWebKit-2.0.so
    module_path: boot():/lib/libWPEInjectedBundle.so
    # ── libwpe ────────────────────────────────────────────────────────────────
    module_path: boot():/lib/libwpe-1.0.so.1
    module_path: boot():/lib/libwpe-1.0.so
    # ── system deps ───────────────────────────────────────────────────────────
